<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Management - Digital Library</title>
    <link rel="stylesheet" href="members.css">
</head>
<body>
    <header>
        <h1>Digital Library Management System</h1>
    </header>
    <main>
        <div class="member-container">
            <h2>Member Management</h2>
            <div class="form-box">
                <h3>Add New Member</h3>
                <form id="memberForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="memberId">Member ID</label>
                            <input type="text" id="memberId" placeholder="Enter Member ID">
                            <span id="memberIdError" class="error"></span>
                        </div>
                        <div class="form-group">
                            <label for="memberName">Name</label>
                            <input type="text" id="memberName" placeholder="Enter Name">
                            <span id="memberNameError" class="error"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="department">Department</label>
                            <input type="text" id="department" placeholder="Enter Department">
                            <span id="departmentError" class="error"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="text" id="email" placeholder="Enter Email">
                            <span id="emailError" class="error"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="mobile">Mobile</label>
                            <input type="text" id="mobile" placeholder="Enter 10-digit Mobile Number">
                            <span id="mobileError" class="error"></span>
                        </div>
                    </div>
                    <div class="button-group">
                        <button type="submit">Add Member</button>
                        <button type="reset" class="reset-button">Reset</button>
                    </div>
                    <p id="memberMessage"></p>
                </form>
            </div>
            <div class="member-list">
                <h3>Member List</h3>
                <div class="search-box">
                    <input type="text" id="seachMember" placeholder="Search by Member ID or Name">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Member ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="memberTableBody"></tbody>
                </table>
            </div>
            <div class="back-container">
                <a href="../dashboard/dashboard.html" class="back-button"> Back to Dashboard </a>
            </div>
        </div>
        <div id="viewModal" class="modal"> 
            <div class="modal-content"> 
                <span class="close-button" onclick="closeView()">&times;</span> 
                <div class="profile-icon">👤</div> 
                <h3>Member Profile</h3> 
                <h2 id="viewMemberName"></h2> 
                <p class="profile-id"> Member ID: <span id="viewMemberId"></span> 
                </p> <hr> 
                <div class="member-details"> 
                    <p> <strong>Department</strong> 
                        <span id="viewDepartment"></span> 
                    </p> 
                    <p> <strong>Email</strong> 
                        <span id="viewEmail"></span> 
                    </p> 
                    <p> <strong>Mobile</strong> 
                        <span id="viewMobile"></span> 
                    </p> 
                    <p> <strong>Member Since</strong> 
                        <span id="viewMemberSince"></span> 
                    </p> 
                    <p> <strong>Status</strong> 
                        <span class="active-status">● Active</span> 
                    </p> 
                </div>
                <button class="close-modal-button" onclick="closeView()">
                    Close
                </button>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Digital Library Management System</p>
    </footer>
    <script src="members.js"></script>
</body>
</html>
