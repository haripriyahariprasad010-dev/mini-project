
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Digital Library</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Original CSS file -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            Digital Library
            <span>MANAGEMENT SYSTEM</span>
        </div>

        <div class="header-text">
            LEARN · EXPLORE · GROW
        </div>

    </header>


    <!-- MAIN LOGIN SECTION -->
    <main class="login-section">

        <div class="login-box">

            <p class="small-title">YOUR PERSONAL LIBRARY</p>

            <h2>Welcome back to<br>your library.</h2>

            <p class="form-text">
                Sign in to continue your journey of knowledge.
                Your digital library is waiting for you.
            </p>


            <!-- ORIGINAL LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="username">USERNAME</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                    >

                    <p id="usernameError" class="input-error"></p>

                </div>


                <div class="form-group">

                    <label for="password">PASSWORD</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter exactly 8 characters"
                        maxlength="8"
                        autocomplete="current-password"
                    >

                    <p id="passwordError" class="input-error"></p>

                </div>


                <!-- ORIGINAL BUTTONS PRESERVED -->
                <div class="button-group">
                    <button type="submit" class="login-button">
                        SIGN IN →
                    </button>
                    <button type="reset" class="reset-button">
                        RESET
                    </button>
                </div>
                <!-- ORIGINAL MESSAGE ID PRESERVED -->
                <p id="loginMessage" class="login-success"></p>
                <!-- ORIGINAL REGISTER LINK PRESERVED -->
                <p class="register-link">
                    New to the library?
                    <a href="../register/register.html">
                        Create an account
                    </a>
                </p>
            </form>
            <!-- BACK TO HOME -->
            <a href="../index.html" class="back-home">
                ← BACK TO HOME
            </a>
        </div>
    </main>
    <!-- FOOTER -->
    <footer>
        © 2026 DIGITAL LIBRARY MANAGEMENT SYSTEM
    </footer>
    <!-- ORIGINAL JAVASCRIPT - DO NOT MODIFY -->
    <script src="login.js"></script>

</body>
</html>
