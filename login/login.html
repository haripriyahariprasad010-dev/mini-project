<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Digital Library</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>
            Digital Library Management System
        </h1>

        <p>
            Your simple and organized digital library
        </p>

    </header>


    <!-- Login -->

    <main class="login-section">

        <div class="login-box">

            <h2>
                Welcome Back
            </h2>

            <p class="form-text">
                Login to access your library
            </p>

            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                >

                <p
                    id="usernameError"
                    class="input-error">
                </p>



                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter exactly 8 characters"
                    maxlength="8"
                    autocomplete="current-password"
                >
                <p
                    id="passwordError"
                    class="input-error">
                </p>
                <div class="button-group">

                    <button type="submit">
                        Login
                    </button>

                    <button
                        type="reset"
                        class="reset-button">

                        Reset

                    </button>

                </div>

                <p
                    id="loginMessage"
                    class="login-success">
                </p>
                <p class="register-link">

                    Don't have an account?

                    <a href="../register/register.html">
    Register
</a>

                </p>

            </form>

        </div>

    </main>

    <footer>

        <p>
            &copy; 2026 Digital Library Management System
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="login.js"></script>

</body>

</html>
